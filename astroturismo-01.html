<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astroturismo en Rebolledo de la Torre</title>
 <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header>
    <h1>Astroturismo desde Rebolledo de la Torre</h1>
    <p>Observación astronómica en el Geoparque Mundial de la UNESCO Las Loras</p>
    <style>
      .contenedor {
  height: 80px; /* El div puede tener cualquier altura */
  width: 100%;   /* O el ancho que tú quieras */
  overflow: hidden; /* Oculta lo que sobresalga */
}

.imagen-ajustada {
  height: 100%;    /* Fuerza a la imagen a medir lo mismo que el div */
  width: 100%;     /* Llena también el ancho */
  object-fit: cover; /* Ajusta y recorta la imagen sin deformarla */
}
    </style>
  </header>

  <main>
    <!-- Banner Rotatorio de Constelaciones y Astrofotografía -->
    <section id="banner-astronomico">
      <h2>Galeria del Firmamento</h2>
      <div class="contenedor">

<div class="contenedor">
  <img src="tu-imagen.jpg" alt="Ejemplo" class="imagen-ajustada">
</div>
        
        <img heigh="50px" src="imagenes/constelacion-orion.jpg" alt="Constelación de Orión visible en los cielos de invierno" class="imagen-ajustada" data-slide="active">
        <img heigh="50px" src="imagenes/constelacion-orion-dibujo.png" alt="Núcleo de la Vía Láctea sobre el paisaje de las Loras" class="imagen-ajustada">
        <img heigh="50px" src="imagenes/via-lactea-loras.jpg" alt="Núcleo de la Vía Láctea sobre el paisaje de las Loras" class="imagen-ajustada">
        <img heigh="50px" src="imagenes/constelacion-osa-mayor.jpg" alt="La Osa Mayor alineada con el norte sobre la Iglesia de San Julián y Santa Basilisa" class="imagen-ajustada">
        <img heigh="50px" src="imagenes/nebulosas-cielo-profundo.jpg" alt="Fotografía de cielo profundo capturada desde el término municipal" class="imagen-ajustada">
      </div>
    </section>
    
  </main>

  <footer>
    <p>Asociación de Astroturismo y Conservación del Cielo Nocturno - Rebolledo de la Torre</p>
  </footer>

  <!-- Lógica de Rotación del Banner (Cada 10 segundos) -->
  <script>
    (function() {
      const imagenesBanner = document.querySelectorAll('#banner-astronomico img');
      let indiceActual = 0;
      const intervaloTiempo = 3000;

      function rotarImagen() {
        if (imagenesBanner.length <= 1) return;
        imagenesBanner[indiceActual].removeAttribute('data-slide');
        indiceActual = (indiceActual + 1) % imagenesBanner.length;
        imagenesBanner[indiceActual].setAttribute('data-slide', 'active');
      }

      if (imagenesBanner.length > 1) {
        setInterval(rotarImagen, intervaloTiempo);
      }
    })();
  </script>
  
</body>
</html>

<script>
  function enviarAltura() {
    window.parent.postMessage(
      {
        frameHeight: document.documentElement.scrollHeight
      },
      "*"
    );
  }

  window.addEventListener("load", enviarAltura);
  window.addEventListener("resize", enviarAltura);
</script>
