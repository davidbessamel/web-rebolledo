<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripcion Quedada</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      padding: 2rem 1rem;
      color: #333;
      line-height: 1.6;
    }
    .container {
      max-width: 540px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p.subtitle { color: #666; margin-bottom: 1.5rem; font-size: 0.95rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.35rem; margin-top: 1rem; font-size: 0.9rem; }
    label .opt { font-weight: 400; color: #999; font-size: 0.85rem; }
    input[type="text"], input[type="tel"], input[type="email"], select, textarea {
      width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 2px rgba(0,102,204,0.15); }
    .checkbox-group { margin-top: 1.25rem; }
    .checkbox-group label { display: flex; align-items: flex-start; gap: 0.5rem; font-weight: 400; margin-top: 0.5rem; cursor: pointer; }
    .checkbox-group input[type="checkbox"] { margin-top: 0.2rem; width: auto; }
    .checkbox-group a { color: #0066cc; }
    button {
      width: 100%; padding: 0.85rem; background: #0066cc; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1.5rem; transition: background 0.2s;
    }
    button:hover { background: #0052a3; }
    button:disabled { background: #999; cursor: not-allowed; }
    #msg { margin-top: 1rem; text-align: center; font-weight: 600; min-height: 1.5em; }
    #msg.success { color: #1a7f37; }
    #msg.error { color: #d1242f; }
    .req { color: #d1242f; }
    .carousel-section {
      max-width: 540px;
      margin: 0 auto 2rem;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .carousel-section iframe {
      width: 100%;
      height: 350px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="carousel-section">
    <iframe src="https://carrusel-bot.david-bessamel.workers.dev/carousel" title="Fotos de la Quedada"></iframe>
  </div>

  <div class="container">
    <h1>Inscripcion a la Quedada</h1>
    <p class="subtitle">Rellena el formulario para apuntarte. Te confirmaremos en el grupo de Telegram.</p>

    <form id="form">
      <label for="nombre">Nombre completo <span class="req">*</span></label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="telefono">Telefono <span class="req">*</span></label>
      <input type="tel" id="telefono" name="telefono" required>

      <label for="email">Email <span class="req">*</span></label>
      <input type="email" id="email" name="email" required>

      <label for="nivel">Nivel de experiencia <span class="req">*</span></label>
      <select id="nivel" name="nivel" required>
        <option value="">-- Selecciona --</option>
        <option value="Principiante">Principiante</option>
        <option value="Intermedio">Intermedio</option>
        <option value="Avanzado">Avanzado</option>
        <option value="Experto">Experto</option>
      </select>

      <label for="equipo">Equipo que traeras <span class="opt">(opcional)</span></label>
      <textarea id="equipo" name="equipo" rows="2" placeholder="Ej: portatil, raton, auriculares..."></textarea>

      <div class="checkbox-group">
        <label><input type="checkbox" name="check1"> Quiero recibir notificaciones por email sobre futuras quedadas</label>
        <label><input type="checkbox" name="check2"> Estoy disponible para ayudar con la organizacion</label>
        <label><input type="checkbox" name="condiciones" required> He leido y acepto las <a href="#" onclick="return false">condiciones de participacion</a> <span class="req">*</span></label>
      </div>

      <button type="submit" id="btn">Enviar inscripcion</button>
    </form>
    <div id="msg"></div>
  </div>

  <script>
    const WORKER_URL = 'https://carrusel-bot.david-bessamel.workers.dev';

    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.className = '';
      btn.disabled = true;
      btn.textContent = 'Enviando...';

      const data = {
        nombre: document.getElementById('nombre').value.trim(),
        telefono: document.getElementById('telefono').value.trim(),
        email: document.getElementById('email').value.trim(),
        nivel: document.getElementById('nivel').value,
        equipo: document.getElementById('equipo').value.trim(),
        check1: document.querySelector('[name="check1"]').checked,
        check2: document.querySelector('[name="check2"]').checked,
        condiciones: document.querySelector('[name="condiciones"]').checked
      };

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (res.ok) {
          msg.textContent = 'OK Inscripcion enviada correctamente!';
          msg.className = 'success';
          form.reset();
        } else {
          msg.textContent = 'Error: ' + (result.error || 'No se pudo enviar');
          msg.className = 'error';
        }
      } catch (err) {
        msg.textContent = 'Error de conexion. Intentalo de nuevo.';
        msg.className = 'error';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar inscripcion';
      }
    });
  </script>
</body>
</html>
