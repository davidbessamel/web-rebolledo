<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripción Quedada</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="container">
    <h1>Inscripción a la Quedada</h1>
    <p class="subtitle">Rellena el formulario para apuntarte. Te confirmaremos en el grupo de Telegram.</p>

    <form id="form">
      <label for="nombre">Nombre completo <span class="req">*</span></label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="telefono">Teléfono <span class="req">*</span></label>
      <input type="tel" id="telefono" name="telefono" required>

      <label for="email">Email <span class="req">*</span></label>
      <input type="email" id="email" name="email" required>

      <label for="nivel">Nivel de experiencia <span class="req">*</span></label>
      <select id="nivel" name="nivel" required>
        <option value="">-- Selecciona --</option>
        <option value="Principiante">Principiante</option>
        <option value="Intermedio">Intermedio</option>
        <option value="Avanzado">Avanzado</option>
        <option value="Experto">Experto</option>
      </select>

      <label for="equipo">Equipo que traerás <span class="opt">(opcional)</span></label>
      <textarea id="equipo" name="equipo" rows="2" placeholder="Ej: portátil, ratón, auriculares..."></textarea>

      <div class="checkbox-group">
        <label><input type="checkbox" name="check1"> Quiero recibir notificaciones por email sobre futuras quedadas</label>
        <label><input type="checkbox" name="check2"> Estoy disponible para ayudar con la organización</label>
        <label><input type="checkbox" name="condiciones" required> He leído y acepto las <a href="#" onclick="return false">condiciones de participación</a> <span class="req">*</span></label>
      </div>

      <button type="submit" id="btn">Enviar inscripción</button>
    </form>
    <div id="msg"></div>
  </div>

  <script>
    // === CAMBIA ESTA URL por la de tu Worker ===
    const WORKER_URL = 'https://formulario-telegram-bot.david-bessamel.workers.dev';

    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.className = '';
      btn.disabled = true;
      btn.textContent = 'Enviando...';

      const data = {
        nombre: document.getElementById('nombre').value.trim(),
        telefono: document.getElementById('telefono').value.trim(),
        email: document.getElementById('email').value.trim(),
        nivel: document.getElementById('nivel').value,
        equipo: document.getElementById('equipo').value.trim(),
        check1: document.querySelector('[name="check1"]').checked,
        check2: document.querySelector('[name="check2"]').checked,
        condiciones: document.querySelector('[name="condiciones"]').checked
      };

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (res.ok) {
          msg.textContent = '✅ ¡Inscripción enviada correctamente!';
          msg.className = 'success';
          form.reset();
        } else {
          msg.textContent = '❌ Error: ' + (result.error || 'No se pudo enviar');
          msg.className = 'error';
        }
      } catch (err) {
        msg.textContent = '❌ Error de conexión. Inténtalo de nuevo.';
        msg.className = 'error';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar inscripción';
      }
    });
  </script>
</body>
</html>
