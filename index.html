<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rebolledo de la Torre | Portal Municipal y Turismo</title>
  <style>
    :root {
      --bg-dark: #000000;
      --bg-card: #121318;
      --text-main: #f3f4f6;
      --accent-gold: #f59e0b;
      --accent-blue: #3b82f6;
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-dark); color: var(--text-main); line-height: 1.5; }

    /* Navigation */
    .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: rgba(0,0,0,0.75); backdrop-filter: blur(10px); }
    .nav-brand { font-weight: bold; font-size: 1.1rem; color: var(--text-main); text-decoration: none; letter-spacing: 0.5px; }
    .nav-links { display: flex; gap: 20px; list-style: none; margin: 0; padding: 0; }
    .nav-links a { color: #d1d5db; text-decoration: none; font-size: 0.95rem; transition: color 0.2s ease; }
    .nav-links a:hover { color: var(--accent-gold); }

    /* Hero */
    .hero-container { position: relative; width: 100%; height: 85vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .hero-video { position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%; transform: translate(-50%, -50%); object-fit: cover; z-index: 1; }
    .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.5) 65%, var(--bg-dark) 100%); z-index: 2; }
    .hero-content { position: relative; z-index: 3; text-align: center; padding: 0 20px; margin-top: 40px; }
    .hero-title { font-size: clamp(2.5rem, 6vw, 4.5rem); margin: 0; text-shadow: 0 4px 12px rgba(0,0,0,0.8); }
    .hero-subtitle { font-size: 1.25rem; color: #d1d5db; margin-top: 10px; }

    /* Main */
    .content-section { padding: 60px 20px; max-width: 1200px; margin: 0 auto; }
    .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
    .card { background-color: var(--bg-card); border: 1px solid #27272a; border-radius: 12px; padding: 24px; }
    .card.alta { border-color: var(--accent-gold); }
    .card h3 { color: var(--accent-gold); margin-top: 0; }
    .badge { background-color: var(--accent-blue); color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; }
    a.btn-link { color: var(--accent-gold); text-decoration: none; font-weight: bold; display: inline-block; margin-top: 10px; }

    @media (max-width: 768px) {
      .navbar { flex-direction: column; gap: 10px; padding: 12px 15px; }
      .nav-links { flex-wrap: wrap; justify-content: center; gap: 12px; font-size: 0.85rem; }
    }

    .cta { text-align: center; padding: 40px 20px; background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0)); border-radius: 12px; }
    .cta a { display: inline-block; background: var(--accent-gold); color: black; padding: 10px 16px; border-radius: 8px; font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="navbar">
    <a href="#" class="nav-brand">Rebolledo de la Torre</a>
    <ul class="nav-links">
      <li><a href="#servicios">Servicios y Horarios</a></li>
      <li><a href="#astroturismo">AstroTurismo</a></li>
      <li><a href="#rutas">Rutas</a></li>
      <li><a href="#huerto">Huerto</a></li>
      <li><a href="#tienda">Tienda</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <header class="hero-container">
    <video class="hero-video" autoplay loop muted playsinline>
      <source src="cielo-nocturno.mp4" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title">Rebolledo de la Torre</h1>
      <p class="hero-subtitle">Naturaleza, historia y cielos limpios</p>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="content-section" id="home">
    <!-- Resto del contenido del sitio (resumen, tarjetas, etc.) -->


<!-- Este es el contenedor de destino que se activará al pulsar el enlace -->
<div id="rutas" class="seccion-rutas">
  <h2>Nuestras Rutas Disponibles</h2>
  <p>Explora el catálogo completo de rutas y actividades programadas para este mes.</p>
  
  <!-- Aquí puedes insertar o embeber el componente del BOCYL u otro contenido -->
</div>



    
  </main>

</body>
</html>
