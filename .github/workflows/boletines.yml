name: "Actualizar Boletines Oficiales y Notificar"
permissions: contents: write

on: schedule: - cron: '30 8 * * *' workflow_dispatch:
jobs: actualizar: runs-on: ubuntu-latest steps: - name: Descargar repositorio uses: actions/checkout@v3 with: persist-credentials: true fetch-depth: 0

  - name: Configurar Python
    uses: actions/setup-python@v4
    with:
      python-version: '3.10'

  - name: Instalar dependencias
    run: |
      python -m pip install --upgrade pip
      pip install requests

  - name: Ejecutar script de extracción (genera JSON y snapshot)
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    run: |
      python actualizar_boletines.py --emit-html

  - name: Guardar cambios en el repositorio
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |
      git config --global user.name 'bot-rebolledo'
      git config --global user.email 'bot@rebolledodetorrenoticias.local'
      git add publicaciones_oficiales.json boletines_snapshot.html || true
      git diff --quiet && git diff --staged --quiet || (
        git commit -m "Auto-update boletines oficiales [skip ci]" && git push
      )

  - name: Subir artifacts (JSON + snapshot) para depuración
    uses: actions/upload-artifact@v4
    with:
      name: boletines-artifacts
      path: |
        publicaciones_oficiales.json
        boletines_snapshot.html


