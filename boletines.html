<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletines Oficiales — Rebolledo de la Torre</title>
  <style>
    :root {
      --bg-dark: #000000;
      --bg-card: #121318;
      --text-main: #f3f4f6;
      --accent-gold: #f59e0b;
      --accent-blue: #3b82f6;
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-dark); color: var(--text-main); line-height: 1.5; }

    .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,255,255,0.1); }
    .nav-brand { font-weight: bold; font-size: 1.1rem; color: var(--text-main); text-decoration: none; letter-spacing: 0.5px; }
    .nav-links { display: flex; gap: 20px; list-style: none; margin: 0; padding: 0; }
    .nav-links a { color: #d1d5db; text-decoration: none; font-size: 0.95rem; transition: color 0.2s ease; }
    .nav-links a:hover { color: var(--accent-gold); }

    .content-section { padding: 90px 20px 60px; max-width: 1200px; margin: 0 auto; }
    .status-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
    .card { background-color: var(--bg-card); border: 1px solid #27272a; border-radius: 12px; padding: 24px; }
    .card.alta { border-color: var(--accent-gold); }
    .card h3 { color: var(--accent-gold); margin-top: 0; }
    .badge { background-color: var(--accent-blue); color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; }
    a.btn-link { color: var(--accent-gold); text-decoration: none; font-weight: bold; display: inline-block; margin-top: 10px; }

    .loader { text-align:center; padding: 40px; color:#9ca3af }
    .btn-secondary { background:transparent; border:1px solid #374151; color:#d1d5db; padding:8px 12px; border-radius:8px; text-decoration:none }

    @media (max-width: 768px) {
      .navbar { flex-direction: column; gap: 10px; padding: 12px 15px; }
      .nav-links { flex-wrap: wrap; justify-content: center; gap: 12px; font-size: 0.85rem; }
    }

    .back-link { margin-bottom: 18px; display: inline-block; color: #d1d5db; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-brand">Rebolledo de la Torre</a>
    <ul class="nav-links">
      <li><a href="index.html#servicios">Servicios y Horarios</a></li>
      <li><a href="index.html#astroturismo">AstroTurismo</a></li>
      <li><a href="index.html#rutas">Rutas</a></li>
      <li><a href="index.html#huerto">Huerto</a></li>
      <li><a href="index.html#tablon">Tablón (volver)</a></li>
      <li><a href="index.html#tienda">Tienda</a></li>
    </ul>
  </nav>

  <main class="content-section" id="boletines">
    <a class="back-link" href="index.html">← Volver al inicio</a>
    <div class="status-bar">
      <h2 style="color: var(--accent-gold); margin:0">Tablón Oficial de Publicaciones (BOCyL / BOE)</h2>
      <div id="last-updated"></div>
    </div>

    <div id="tablon-container" class="grid-cards">
      <div class="loader">Cargando publicaciones oficiales recientes…</div>
    </div>

    <div style="text-align:center; margin-top:18px;">
      <button id="ver-mas" class="btn-secondary">Ver más</button>
      <a id="ver-snapshot" class="btn-secondary" href="#" style="margin-left:8px; display:none">Ver snapshot (sin JS)</a>
    </div>
  </main>

  <script>
    const PAGE_SIZE = 6;
    let allItems = [];
    let shown = 0;

    function mkCardHTML(pub) {
      return `
        <article class="card ${pub.prioridad === 'Alta' ? 'alta' : ''}">
          <span class="badge">${pub.origen}</span>
          <small style="float:right; color:#a1a1aa;">${pub.fecha}</small>
          <h3 style="margin-top:12px;">${pub.titulo}</h3>
          <p>${pub.resumen}</p>
          <a href="${pub.enlace}" target="_blank" class="btn-link">Ver disposición en PDF →</a>
        </article>
      `;
    }

    function renderNextPage() {
      const cont = document.getElementById('tablon-container');
      const slice = allItems.slice(shown, shown + PAGE_SIZE);
      if (shown === 0) cont.innerHTML = '';
      cont.insertAdjacentHTML('beforeend', slice.map(s => mkCardHTML(s)).join(''));
      shown += slice.length;
      document.getElementById('ver-mas').style.display = shown < allItems.length ? 'inline-block' : 'none';
    }

    function renderAll(items) {
      allItems = items;
      shown = 0;
      if (!items || !items.length) {
        document.getElementById('tablon-container').innerHTML = '<p>No hay alertas recientes.</p>';
        document.getElementById('ver-mas').style.display = 'none';
        return;
      }
      renderNextPage();
    }

    async function tryFetchSnapshot() {
      try {
        const head = await fetch('boletines_snapshot.html', { method: 'HEAD' });
        if (head && head.ok) {
          const a = document.getElementById('ver-snapshot');
          a.href = 'boletines_snapshot.html';
          a.style.display = 'inline-block';
        }
      } catch (e) { /* ignore */ }
    }

    async function cargarTablon() {
      try {
        const res = await fetch('publicaciones_oficiales.json');
        if (!res.ok) throw new Error('Archivo JSON no encontrado');
        const data = await res.json();
        const items = data.items || data; // backwards compat
        if (data.generated_at) document.getElementById('last-updated').innerText = 'Última actualización: ' + (new Date(data.generated_at)).toLocaleString();
        renderAll(items);
      } catch (e) {
        console.warn("No se pudo cargar publicaciones_oficiales.json; intentando snapshot y luego datos de ejemplo.", e);
        await tryFetchSnapshot();
        // Intentar cargar snapshot como fallback
        try {
          const s = await fetch('boletines_snapshot.html');
          if (s.ok) {
            document.getElementById('tablon-container').innerHTML = '<iframe src="boletines_snapshot.html" style="width:100%;height:600px;border:0;background:#000"></iframe>';
            document.getElementById('ver-mas').style.display = 'none';
            return;
          }
        } catch (ex) { /* ignore */ }
        // Fallback a datos de ejemplo
        renderAll([
          {
            origen: "BOCyL",
            prioridad: "Alta",
            fecha: "2026-08-20",
            titulo: "Subvención para la conservación del patrimonio rural en Rebolledo de la Torre",
            resumen: "Convocatoria de ayudas destinadas a la rehabilitación de edificaciones tradicionales y adecuación de espacios públicos en municipios del norte de Burgos.",
            enlace: "#"
          }
        ]);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      cargarTablon();
      document.getElementById('ver-mas').addEventListener('click', renderNextPage);
    });
  </script>
</body>
</html>
