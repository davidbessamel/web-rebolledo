<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>Rebolledo de la Torre - Huerta - Banners</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <style>

  </style>
</head>
<body>

  <!-- BANNER GENERAL -->
  <div class="banner-container" id="containerGeneral" style="display:block">
    <div class="banner-header-title">Rebolledo de la Torre - Huerta - Novedades Generales</div>
    <div class="banner-viewport"><div class="banner-slides" id="slidesGeneral"><div class="slide"><iframe src="https://t.me/rebolledodelatorrehuerta/7?embed=1" scrolling="no"></iframe></div>
<div class="slide"><iframe src="https://t.me/rebolledodelatorrehuerta/8?embed=1" scrolling="no"></iframe></div>
<div class="slide"><iframe src="https://t.me/rebolledodelatorrehuerta/9?embed=1" scrolling="no"></iframe></div>
<div class="slide"><iframe src="https://t.me/rebolledodelatorrehuerta/10?embed=1" scrolling="no"></iframe></div>
<div class="slide"><iframe src="https://t.me/rebolledodelatorrehuerta/11?embed=1" scrolling="no"></iframe></div>
<div class="slide"><iframe src="https://t.me/rebolledodelatorrehuerta/12?embed=1" scrolling="no"></iframe></div>
</div></div>
    <button class="nav-btn prev" onclick="moveSlide('general', -1)">❮</button>
    <button class="nav-btn next" onclick="moveSlide('general', 1)">❯</button>
    <div class="dots-container" id="dotsGeneral"><span class="dot dot-general active" onclick="currentSlide('general', 0)"></span>
<span class="dot dot-general " onclick="currentSlide('general', 1)"></span>
<span class="dot dot-general " onclick="currentSlide('general', 2)"></span>
<span class="dot dot-general " onclick="currentSlide('general', 3)"></span>
<span class="dot dot-general " onclick="currentSlide('general', 4)"></span>
<span class="dot dot-general " onclick="currentSlide('general', 5)"></span>
</div>
  </div>

  <!-- BANNER MESES -->
  <div class="banner-container" id="containerMeses" style="display:block">
    <div class="banner-header-title">Rebolledo de la Torre - Huerta - Calendario de Labores</div>
    <div class="banner-viewport"><div class="banner-slides" id="slidesMeses"><div class="slide"><iframe src="https://t.me/rebolledodelatorrehuerta/14?embed=1" scrolling="no"></iframe></div>
<div class="slide"><iframe src="https://t.me/rebolledodelatorrehuerta/15?embed=1" scrolling="no"></iframe></div>
</div></div>
    <button class="nav-btn prev" onclick="moveSlide('meses', -1)">❮</button>
    <button class="nav-btn next" onclick="moveSlide('meses', 1)">❯</button>
    <div class="dots-container" id="dotsMeses"><span class="dot dot-meses active" onclick="currentSlide('meses', 0)"></span>
<span class="dot dot-meses " onclick="currentSlide('meses', 1)"></span>
</div>
  </div>

  <script>
    const bannersConfig = {
      general: { currentIndex: 0, totalSlides: 6, interval: null, slidesId: 'slidesGeneral', dotClass: 'dot-general' },
      meses: { currentIndex: 0, totalSlides: 2, interval: null, slidesId: 'slidesMeses', dotClass: 'dot-meses' }
    };

    const intervalTime = 7000;

    function updateBanner(key) {
      const config = bannersConfig[key];
      const slides = document.getElementById(config.slidesId);
      const dots = document.querySelectorAll('.' + config.dotClass);
      if (slides) {
        slides.style.transform = 'translateX(-' + (config.currentIndex * 100) + '%)';
        dots.forEach((dot, index) => { dot.classList.toggle('active', index === config.currentIndex); });
      }
    }

    function moveSlide(key, direction) {
      const config = bannersConfig[key];
      if (config.totalSlides === 0) return;
      config.currentIndex = (config.currentIndex + direction + config.totalSlides) % config.totalSlides;
      updateBanner(key);
      resetTimer(key);
    }

    function currentSlide(key, index) {
      bannersConfig[key].currentIndex = index;
      updateBanner(key);
      resetTimer(key);
    }

    function startTimer(key) {
      bannersConfig[key].interval = setInterval(() => { moveSlide(key, 1); }, intervalTime);
    }

    function resetTimer(key) { clearInterval(bannersConfig[key].interval); startTimer(key); }

    document.addEventListener("DOMContentLoaded", () => {
      if(6 > 0) startTimer('general');
      if(2 > 0) startTimer('meses');
    });
  </script>
</body>
</html>
