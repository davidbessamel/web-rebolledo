<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>Plantilla Universal de Banners - Telegram Widgets</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 20px;
    }

    /* --- CARGADOR INICIAL --- */
    .upload-container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      text-align: center;
      border: 2px dashed #cbd5e1;
    }

    .upload-container h2 {
      margin-top: 0;
      color: #1e293b;
    }

    .upload-container p {
      color: #64748b;
      font-size: 0.95rem;
    }

    .file-input-btn {
      background-color: #0284c7;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .file-input-btn:hover {
      background-color: #0369a1;
    }

    /* --- ESTILOS DE LOS CONTENEDORES --- */
    .banner-container {
      width: 100%;
      max-width: 900px;
      margin: 30px auto;
      overflow: hidden;
      position: relative;
      background: #f1f5f9;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      padding: 20px;
      box-sizing: border-box;
    }

    .banner-header-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 15px;
      border-left: 4px solid #0284c7;
      padding-left: 10px;
    }

    .banner-slides {
      display: flex;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      width: 100%;
    }

    .slide {
      min-width: 100%;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
    }

    /* Ajuste responsivo de la inserción oficial de Telegram */
    .slide iframe {
      width: 100% !important;
      max-width: 100% !important;
      border: none !important;
      box-shadow: none !important;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(15, 23, 42, 0.05);
      color: #1e293b;
      border: 1px solid rgba(15, 23, 42, 0.1);
      padding: 14px 18px;
      cursor: pointer;
      font-size: 20px;
      border-radius: 50%;
      z-index: 3;
      transition: all 0.3s;
    }

    .nav-btn:hover { background: rgba(15, 23, 42, 0.8); color: white; }
    .prev { left: 20px; }
    .next { right: 20px; }

    .dots-container {
      text-align: center;
      margin-top: 15px;
    }

    .dot {
      cursor: pointer;
      height: 10px;
      width: 10px;
      margin: 0 6px;
      background-color: #cbd5e1;
      border-radius: 50%;
      display: inline-block;
      transition: all 0.4s ease;
    }

    .active, .dot:hover { background-color: #0284c7; transform: scale(1.3); }

    #sandbox-data { display: none; }
  </style>
</head>
<body>

  <!-- CARGADOR INTERACTIVO INICIAL -->
  <div class="upload-container" id="uploaderBox">
    <h2>Cargar Archivo del Canal</h2>
    <p>Selecciona tu archivo <strong>messages.html</strong> exportado para generar los banners automáticamente en local de forma segura.</p>
    <input type="file" id="fileSelector" accept=".html" style="display:none;" onchange="cargarArchivoLocal(this)">
    <button class="file-input-btn" onclick="document.getElementById('fileSelector').click()">Seleccionar messages.html</button>
  </div>

  <!-- CONTENEDOR PARA EL PRIMER BANNER (GENERAL) -->
  <div class="banner-container" id="containerGeneral" style="display:none;">
    <div class="banner-header-title" id="titleGeneral">General</div>
    <div class="banner-slides" id="slidesGeneral"></div>
    <button class="nav-btn prev" onclick="moveSlide('general', -1)">❮</button>
    <button class="nav-btn next" onclick="moveSlide('general', 1)">❯</button>
    <div class="dots-container" id="dotsGeneral"></div>
  </div>

  <!-- CONTENEDOR PARA EL SEGUNDO BANNER (POR MESES) -->
  <div class="banner-container" id="containerMeses" style="display:none;">
    <div class="banner-header-title" id="titleMeses">Calendario</div>
    <div class="banner-slides" id="slidesMeses"></div>
    <button class="nav-btn prev" onclick="moveSlide('meses', -1)">❮</button>
    <button class="nav-btn next" onclick="moveSlide('meses', 1)">❯</button>
    <div class="dots-container" id="dotsMeses"></div>
  </div>

  <!-- BUFFER EN LA SOMBRA PARA EL PROCESAMIENTO -->
  <div id="sandbox-data"></div>

  <!-- Cargador de Inserciones Oficiales de Telegram (Línea Completa Asegurada) -->
  <script async src="https://telegram.org"></script>

  <script>
    const mesesValidos = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

    const bannersConfig = {
      general: { currentIndex: 0, totalSlides: 0, interval: null, slidesId: 'slidesGeneral', dotsContainerId: 'dotsGeneral', dotClass: 'dot-general' },
      meses: { currentIndex: 0, totalSlides: 0, interval: null, slidesId: 'slidesMeses', dotsContainerId: 'dotsMeses', dotClass: 'dot-meses' }
    };

    function cargarArchivoLocal(input) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const sandbox = document.getElementById('sandbox-data');
        sandbox.innerHTML = e.target.result;
        
        // Ocultamos el selector de archivo inicial
        document.getElementById('uploaderBox').style.display = 'none';
        
        // Procesamos la plantilla universal
        procesarPlantillaUniversal();
      };
      reader.readAsText(file);
    }

    function procesarPlantillaUniversal() {
      const sandbox = document.getElementById('sandbox-data');
      
      // 1. EXTRACCIÓN MAESTRA DEL TÍTULO DE LA CABECERA ORIGINAL
      const headerTextEl = sandbox.querySelector('.page_header .content .text.bold');
      const nombreGrupoRaw = headerTextEl ? headerTextEl.textContent.trim() : 'Canal de Telegram';

      // 2. EXTRACCIÓN AVANZADA DEL ALIAS PÚBLICO REAL VÍA INGENIERÍA INVERSA
      // Buscamos en las etiquetas de los mensajes de servicio de creación o fijado (ej: «Rebolledo de la Torre - Huerta»)
      const serviceBodyEl = sandbox.querySelector('.message.service .body');
      let aliasTelegramPublico = "";
      
      if (serviceBodyEl) {
        // Obtenemos el texto completo interno de las comillas francesas « » nativas de Telegram
        const matchAlias = serviceBodyEl.textContent.match(/«([^»]+)»/);
        if (matchAlias && matchAlias[1]) {
          aliasTelegramPublico = matchAlias[1]
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "") // Quita acentos
            .replace(/[^a-zA-Z0-9]/g, "")   // Quita espacios y símbolos
            .toLowerCase();
        }
      }

      // Si por alguna razón la estructura cambia, usamos el fallback seguro de limpieza sobre el título
      if (!aliasTelegramPublico) {
        aliasTelegramPublico = nombreGrupoRaw
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-zA-Z0-9]/g, "")
          .toLowerCase();
      }

      // Modificamos los títulos dinámicos con el nombre extraído
      document.getElementById('titleGeneral').textContent = `${nombreGrupoRaw} - General`;
      document.getElementById('titleMeses').textContent = `${nombreGrupoRaw} - Calendario Mensual`;

      const originalMessages = sandbox.querySelectorAll('.message.default');
      
      let generalSlidesHTML = '';
      let generalDotsHTML = '';
      let generalCount = 0;

      let mesesSlidesHTML = '';
      let mesesDotsHTML = '';
      let mesesCount = 0;

      originalMessages.forEach((msg) => {
        const photoWrap = msg.querySelector('.media_wrap .photo_wrap');
        
        if (photoWrap) {
          const msgIdAttr = msg.getAttribute('id') || '';
          const msgNum = msgIdAttr.replace('message', '').trim();
          
          const textElement = msg.querySelector('.body > .text');
          let esMensajeDeMes = false;
          if (textElement) {
            const textoBuscador = textElement.textContent.toLowerCase();
            esMensajeDeMes = mesesValidos.some(mes => textoBuscador.includes(mes));
          }

          if (msgNum) {
            // Incrustación oficial construida dinámicamente conectada a los servidores remotos
            const slideHTML = `
              <div class="slide">
                <blockquote class="telegram-post" data-telegram-post="${aliasTelegramPublico}/${msgNum}" data-width="100%">
                  <a href="https://t.me{aliasTelegramPublico}/${msgNum}">Cargando contenido desde Telegram...</a>
                </blockquote>
              </div>
            `;

            if (esMensajeDeMes) {
              mesesSlidesHTML += slideHTML;
              mesesDotsHTML += `<span class="dot dot-meses ${mesesCount === 0 ? 'active' : ''}" onclick="currentSlide('meses', ${mesesCount})"></span>`;
              mesesCount++;
            } else {
              generalSlidesHTML += slideHTML;
              generalDotsHTML += `<span class="dot dot-general ${generalCount === 0 ? 'active' : ''}" onclick="currentSlide('general', ${generalCount})"></span>`;
              generalCount++;
            }
          }
        }
      });

      // Renderizar y arrancar Banner General
      if (generalCount > 0) {
        bannersConfig.general.totalSlides = generalCount;
        document.getElementById('slidesGeneral').innerHTML = generalSlidesHTML;
        document.getElementById('dotsGeneral').innerHTML = generalDotsHTML;
document.getElementById('containerGeneral').style.display = 'block';startTimer('general');}// Renderizar y arrancar Banner de Mesesif (mesesCount > 0) {bannersConfig.meses.totalSlides = mesesCount;document.getElementById('slidesMeses').innerHTML = mesesSlidesHTML;document.getElementById('dotsMeses').innerHTML = mesesDotsHTML;document.getElementById('containerMeses').style.display = 'block';startTimer('meses');}// Solicitamos a la pasarela de Telegram que dibuje los widgets remotos de forma síncronaif (window.Telegram && window.Telegram.MyWidgets) {window.Telegram.MyWidgets.init();}sandbox.innerHTML = '';}const intervalTime = 7000;function updateBanner(key) {const config = bannersConfig[key];const slides = document.getElementById(config.slidesId);const dots = document.querySelectorAll('.' + config.dotClass);if (slides) {slides.style.transform = translateX(-${config.currentIndex * 100}%);dots.forEach((dot, index) => {dot.classList.toggle('active', index === config.currentIndex);});}}function moveSlide(key, direction) {const config = bannersConfig[key];if (config.totalSlides === 0) return;config.currentIndex = (config.currentIndex + direction + config.totalSlides) % config.totalSlides;updateBanner(key);resetTimer(key);}function currentSlide(key, index) {bannersConfig[key].currentIndex = index;updateBanner(key);resetTimer(key);}function startTimer(key) {bannersConfig[key].interval = setInterval(() => {moveSlide(key, 1);}, intervalTime);}function resetTimer(key) {clearInterval(bannersConfig[key].interval);startTimer(key);}
